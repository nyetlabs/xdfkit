# Build and release on every vX.Y.Z tag; vX.Y.Z-rcN tags make prereleases. See README "Releases".
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    # contents: write for softprops/action-gh-release.
    # pull-requests: read for git-cliff's PR titles.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make package
        run: make package
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            git-cliff --latest --strip header -o release-notes.md
          else
            git-cliff --latest --strip header --ignore-tags 'v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+' -o release-notes.md
          fi
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
